version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: badil_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Badil_SecurePassword123!
    ports:
      - "1433:1433"
    volumes:
      - badil_data:/var/opt/mssql

volumes:
  badil_data: